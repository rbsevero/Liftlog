<style>

inimise player" style="flex:0 0 44px">▾</button><button data-a=muc aria-label="Close player" style="flex:0 0 44px">✕</button></div><iframe id=mpf title="Music player" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe></div><button id=mu hidden data-a=mut aria-label="Open music player">♫</button>
<script>
const LIB='Bench Press (Barbell)|Chest|Barbell;Incline Bench Press (Dumbbell)|Chest|Dumbbell;Chest Fly (Machine)|Chest|Machine;Cable Fly|Chest|Cable;Push Up|Chest|Bodyweight;Lat Pulldown (Cable)|Back|Cable;Seated Cable Row|Back|Cable;Bent Over Row (Barbell)|Back|Barbell;Pull Up|Back|Bodyweight;One Arm Row (Dumbbell)|Back|Dumbbell;Deadlift (Barbell)|Back|Barbell;Overhead Press (Barbell)|Shoulders|Barbell;Shoulder Press (Dumbbell)|Shoulders|Dumbbell;Lateral Raise (Dumbbell)|Shoulders|Dumbbell;Rear Delt Fly (Machine)|Shoulders|Machine;Bicep Curl (Dumbbell)|Biceps|Dumbbell;Hammer Curl (Dumbbell)|Biceps|Dumbbell;Preacher Curl (Machine)|Biceps|Machine;Triceps Pushdown (Cable)|Triceps|Cable;Skullcrusher (Barbell)|Triceps|Barbell;Triceps Dip|Triceps|Bodyweight;Squat (Barbell)|Quadriceps|Barbell;Leg Press (Machine)|Quadriceps|Machine;Leg Extension (Machine)|Quadriceps|Machine;Hack Squat (Machine)|Quadriceps|Machine;Squat (Smith Machine)|Quadriceps|Smith machine;Romanian Deadlift (Barbell)|Hamstrings|Barbell;Seated Leg Curl (Machine)|Hamstrings|Machine;Lying Leg Curl (Machine)|Hamstrings|Machine;Hip Thrust (Barbell)|Glutes|Barbell;Glute Kickback (Cable)|Glutes|Cable;Standing Calf Raise (Machine)|Calves|Machine;Seated Calf Raise|Calves|Machine;Plank|Core|Bodyweight;Crunch|Core|Bodyweight;Cable Crunch|Core|Cable;Hanging Leg Raise|Core|Bodyweight;Treadmill|Cardio|Other;Cycling|Cardio|Other';

const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');

const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0'),dur=ms=>{const m=Math.floor(ms/6e4);return m>=60?Math.floor(m/60)+'h '+m%60+'m':m+'m'};
const wkOf=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return +d},pw=k=>{const d=new Date(k);d.setDate(d.getDate()-7);return +d};
let db,W=[],X=[],R=[],B=[],V=[],Q=[],GS=null,IV=null,WL=null,A=null,S={warm:false,rest:90},tab='home',ch,skS=0,now=new Date();
let U={cy:now.getFullYear(),cm:now.getMonth(),sd:0,m:null,mt:'vol',ex:'',rg:90},T={left:0,run:false,end:0,tot:90};
const ws=e=>e.sets.filter(s=>s.done&&(!s.warm||S.warm)),cnt=w=>w.ex.reduce((a,e)=>a+ws(e).length,0),rep=w=>w.ex.reduce((a,e)=>tmI(e.id)?a:a+ws(e).reduce((b,s)=>b+s.r,0),0),vol=w=>w.ex.reduce((a,e)=>a+ws(e).reduce((b,s)=>b+s.w*s.r,0),0);

const stat=(id,sk)=>{let bw=0,bo=0;W.forEach(w=>w.id!=sk&&w.ex.filter(x=>x.id==id).forEach(x=>ws(x).forEach(s=>{bw=Math.max(bw,s.w);bo=Math.max(bo,e1(s.w,s.r))})));return{bw,bo}};
const sa=()=>db.k.put({k:'a',v:A}),sv=()=>db.k.put({k:'s',v:S});

/* timer */

function tick(){ivTick();gsTick();if(T.run){T.left=Math.max(0,Math.ceil((T.end-Date.now())/1e3));if(!T.left){T.run=false;T.fl=true;beep();const b=$('#tb');b&&b.classList.add('fl')}}const t=$('#tv');if(t)t.textContent=mmss(T.left);const d=$('#du');if(d&&A)d.textContent=dur((A.editId?A.end:Date.now())-A.start)}
function totals(){const el=$('#tot');if(!el||!A)return;const w={ex:A.ex};let b=0;A.ex.forEach(x=>ws(x).forEach(s=>b=Math.max(b,e1(s.w,s.r))));el.textContent=`${cnt(w)} sets · ${rep(w)} reps · ${fn(vol(w))} kg · best est. 1RM ${fn(b)} kg`}
/* views */
function wCard(w){return `<button class=c data-a=det data-id="${w.id}"><b>${E(w.name)}</b>${w.src=='sample'?' <span class=m>(sample)</span>':''}<div class=m>${fd(w.start)} · ${w.end>w.start?dur(w.end-w.start):'duration n/a'} · ${cnt(w)} sets · ${fn(vol(w))} kg</div></button>`}
function vHome(){const c=done(),ev=evs(),t0=wkOf(Date.now()),tw=ev.filter(t=>t>=t0).length,avg=ev.filter(t=>t<t0&&t>=t0-49*day).length/7,sets=c.reduce((a,w)=>a+cnt(w),0),vo=c.reduce((a,w)=>a+vol(w),0),sd=t=>Q.filter(a=>a.type==t).reduce((s,a)=>s+a.dist,0),tile=(n,l)=>`<div class=c><div class=n>${n}</div><div class=m>${l}</div></div>`,

prs=X.map(x=>({n:x.name,...stat(x.id)})).filter(p=>p.bw).sort((a,b)=>b.bo-a.bo).slice(0,5),
rec=[...c.map(w=>[w.start,wCard(w)]),...Q.map(a=>[a.start,aCard(a)]),...V.map(v=>[v.start,`<div class=c><b>Interval: ${E(v.name)}</b><div class=m>${fd(v.start)} · ${v.work}/${v.rest}s × ${v.rounds}</div></div>`])].sort((a,b)=>b[0]-a[0]);
return `<h1>LiftLog</h1>${hm()}${GS?`<button class=c data-a=nav data-t=ac style='border-color:var(--g)'><b>Activity in progress</b><div class=m>Tap to open the tracker</div></button>`:''}<button class="p w" data-a=start>${A?'Resume strength workout':'Start strength workout'}</button><div class=g style='grid-template-columns:repeat(3,1fr);margin:8px 0'>${Object.keys(AT).map(k=>`<button data-a=qa data-t=${k}>${AT[k][1]}<br>${AT[k][0]}</button>`).join('')}</div><button class=w data-a=ivo>Interval training: Tabata, EMOM, circuits</button><h2>Overview</h2><div class=g>${tile(c.length+Q.length+V.length,'Total workouts')+tile(c.length,'Strength sessions')+tile(fn(act/3600)+' h','Total active time')+tile(streak()+' wk','Streak: weeks in a row with activity')+tile(fdist(sd('walk')),'Walking distance')+tile(fdist(sd('run')),'Running distance')+tile(fdist(sd('cycle')),'Cycling distance')+tile(tw,'Sessions this week')}</div><p class=m>Weekly average over the last 7 weeks: ${fn(avg)} sessions. Strength: ${sets} working sets · ${fn(vo/1000)} t volume · last workout ${c[0]?fd(c[0].start):'none yet'}.</p><h2>Weekly goals</h2>${gBars()||'<p class=m>No goals yet. Set them in Profile.</p>'}<h2>Personal records</h2>${prs.length?prs.map(p=>`<div class="c r"><b>${E(p.n)}</b><span class=m style="text-align:right">${fn(p.bw)} kg · 1RM ${fn(p.bo)}</span></div>`).join(''):'<p class=m>Records appear once you log or import workouts.</p>'}<h2>Recent activity</h2>${rec.length?rec.slice(0,U.all?9999:6).map(r=>r[1]).join('')+(rec.length>6?`<button class=w data-a=all>${U.all?'Show fewer':'Show all '+rec.length}</button>`:''):'<p class=m>Nothing yet. Start a workout or an activity, or import your data in Profile.</p>'}`}
function vWo(){if(!A)return `<h1>Workout</h1><button class="p w" data-a=start>Start empty workout</button><button class=w data-a=ivo style='margin-top:8px'>${IV&&IV.ph!='done'?'Interval in progress: open timer':'Interval training: Tabata, EMOM, circuits'}</button><h2>Start from a routine</h2>${R.length?R.map(r=>`<button class=c data-a=startR data-id="${r.id}"><b>${E(r.name)}</b><div class=m>${r.items.map(i=>E(i.n)).join(', ')}</div></button>`).join(''):'<p class=m>Create routines in the Routines tab.</p>'}`;
